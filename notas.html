<div class="col-12 vista-notas">
  <div class="panel p-4 mx-auto narrow-panel-wide">
    <h2 class="section-title"><i class="bi bi-journal-text"></i> Gestor de notas</h2>
    <hr />

    <div id="formulario" class="row g-2">
      <div class="col-12">
        <label for="titulo" class="form-label">Título</label>
        <input
          type="text"
          class="form-control"
          id="titulo"
          placeholder="Título de la nota"
          required
        />
      </div>
      <div class="col-12">
        <label for="contenido" class="form-label">Contenido</label>
        <textarea
          class="form-control"
          id="contenido"
          placeholder="Contenido de la nota"
          rows="4"
          required
        ></textarea>
      </div>
      <div class="col-12">
        <label for="fecha" class="form-label">A realizar el día</label>
        <input type="datetime-local" class="form-control" id="fecha" required />
      </div>
      <div class="col-12 d-flex flex-wrap gap-2">
        <button class="btn btn-primary flex-fill" type="button" onclick="guardarNota()">
          <i class="bi bi-save me-1"></i>Guardar nota
        </button>
        <button
          id="btn-cargar"
          class="btn btn-outline-accent flex-fill"
          type="button"
          aria-controls="lista-notas"
          aria-expanded="false"
          onclick="alternarNotas()"
        >
          <i class="bi bi-eye me-1"></i>Ver notas
        </button>
      </div>
    </div>

    <h3 class="h5 mt-4"><i class="bi bi-sticky me-1"></i>Mis notas</h3>
    <div id="lista-notas"></div>
  </div>
</div>
