name: Comprobaciones

on:
  push:
    branches:
      - main
      - herramientas
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint + formato + tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar lint, formato y suites
        run: npm run check
